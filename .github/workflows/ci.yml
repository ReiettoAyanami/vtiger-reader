# CI, as in substance-tracker: the version rules, the API's and the web's tests, npm audit and the
# image built on every push, and published (to the GitHub Container Registry, with a GitHub Release)
# only from main with a final version (a alpha, b beta, v release).
name: CI

on:
  push:
    branches: [main, 'dev*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version rules
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: The version of this commit, and the rules of its branch
        run: |
          version=$(sed -n "s/^export const VERSION = '\(.*\)';$/\1/p" api/src/version.ts)
          level=$(sed -n "s/^export const API_LEVEL = \([0-9]*\);$/\1/p" api/src/version.ts)
          # The pages carry a copy (web/src/app/app-version.ts): the same, always.
          app_version=$(sed -n "s/^export const APP_VERSION = '\(.*\)';$/\1/p" web/src/app/app-version.ts)
          app_level=$(sed -n "s/^export const APP_API_LEVEL = \([0-9]*\);$/\1/p" web/src/app/app-version.ts)
          if [ "$app_version" != "$version" ] || [ "$app_level" != "$level" ]; then
            echo "::error::web/src/app/app-version.ts ($app_version, level $app_level) must say what api/src/version.ts says ($version, level $level)"; exit 1
          fi
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "version $version on $branch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$branch" in
            main)
              # Final versions only, numbers only, the build in four digits: a26.0.0.0001, v26.1.2.0000.
              [[ "$version" =~ ^[abv][0-9]{2}\.[0-9]+\.[0-9]+\.[0-9]{4}$ ]] || { echo "::error::on main the version is a, b or v with numbers only and a four-digit build, not $version"; exit 1; } ;;
            dev)
              # The integration branch: every change starts from it and comes back to it; it carries
              # the version of the last branch merged into it.
              [[ "$version" =~ ^dev[0-9]{2}\.[0-9]+\.[0-9]+\.[0-9]{4}(-[a-z0-9]+(-[a-z0-9]+)*)?$ ]] || { echo "::error::on dev the version is a dev version with a four-digit build, not $version"; exit 1; } ;;
            dev*)
              # A branch of work, from dev, is named after its new version without the build
              # (dev26.0.1 carries dev26.0.1.0000, dev26.0.1-squircle carries dev26.0.1.0000-squircle).
              [[ "$version" =~ ^dev[0-9]{2}\.[0-9]+\.[0-9]+\.[0-9]{4}(-[a-z0-9]+(-[a-z0-9]+)*)?$ ]] || { echo "::error::$version is not a dev version with a four-digit build"; exit 1; }
              named=$(sed -E 's/\.[0-9]{4}(-|$)/\1/' <<< "$version")
              [ "$named" = "$branch" ] || { echo "::error::the branch $branch carries version $version: the branch must be named $named"; exit 1; } ;;
          esac

  api:
    name: API tests
    runs-on: ubuntu-latest
    # The database is SQLite in memory, one per test file (plan 7.3): no service to start.
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What ships in the image: the API's production dependencies and the web's (built into static
      # files). A high or critical advisory there fails the build.
      - name: Production dependencies (blocking)
        run: |
          (cd api && npm audit --omit=dev --audit-level=high)
          (cd web && npm audit --omit=dev --audit-level=high)
      # The build tools (Angular CLI and builder, test runner) never reach the image: their advisories
      # are shown here, Dependabot proposes the updates.
      - name: Build tools (shown, not blocking)
        continue-on-error: true
        run: |
          (cd api && npm audit --audit-level=high)
          (cd web && npm audit --audit-level=high)

  desktop:
    name: Desktop app (Windows installer)
    needs: [version, api, web, audit]
    runs-on: windows-latest
    permissions:
      # contents: write for the GitHub Release of a published version.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: The web build
        working-directory: web
        env:
          NG_CLI_ANALYTICS: 'false'
        run: |
          npm ci
          npx ng build
      - name: The app and its installer
        working-directory: api
        run: |
          npm ci
          npm run build
          npx electron-builder --win --publish never
      # The packaged app starts unseen, shows the tickets page from its own API, holds its lock, quits.
      - name: Smoke test of the packaged app
        working-directory: api/release/win-unpacked
        shell: bash
        env:
          VTIGER_READER_DATA: ${{ runner.temp }}/vtiger-reader-smoke
        run: ./"vtiger reader.exe" --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: vtiger-reader-setup-${{ needs.version.outputs.version }}
          path: api/release/*.exe
          retention-days: 30
      # A final version from main: its GitHub Release, with the installer (never overwritten: lenzi
      # decides the next version).
      - if: github.event_name == 'push' && github.ref_name == 'main'
        name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::warning::$VERSION is already released: this commit is not"
            exit 0
          fi
          prerelease=""
          [[ "$VERSION" == v* ]] || prerelease="--prerelease"
          gh release create "$VERSION" api/release/*.exe --target "$GITHUB_SHA" --title "$VERSION" $prerelease --notes "The Windows installer of vtiger reader $VERSION."
