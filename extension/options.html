<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vtiger-reader: settings</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1f1f22; color: #e6e6ea; font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.5; }
  main { box-sizing: border-box; max-width: 560px; margin: 40px auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #121214; border: 2px solid #3d3d44; border-radius: 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; color: #d0bcff; }
  p { margin: 0; color: #b9b9c1; }
  label { font-weight: 700; font-size: 12px; text-transform: uppercase; color: #8b8b95; }
  input { box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 2px solid #3d3d44; border-radius: 10px; background: #18181b; color: #e6e6ea; font: inherit; }
  input:focus { outline: 2px solid #d0bcff; outline-offset: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  button { height: 44px; padding: 0 18px; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; border: 2px solid #8b8b95; background: transparent; color: #e6e6ea; }
  button.primary { background: #d0bcff; border-color: #d0bcff; color: #381e72; }
  button:disabled { opacity: .38; cursor: not-allowed; }
  #status { min-height: 1.5em; color: #97f0ff; }
  #status.error { color: #ffb4ab; }
</style>
</head>
<body>
<main>
  <h1>vtiger-reader</h1>
  <p>Enter the address of your CRM. The browser will ask permission for that one site only. Nothing else is read.</p>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="crm">CRM address</label>
    <input id="crm" type="url" placeholder="https://crm.example.com" autocomplete="off" spellcheck="false">
  </div>
  <div class="row">
    <button id="save" class="primary" type="button">Allow and turn on</button>
    <button id="forget" type="button">Forget this CRM</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p>Test version: the screens show sample data for now. The real tickets come in the next step.</p>
</main>
<script src="options.js"></script>
</body>
</html>
