<mat-sidenav-container class="shell">
  <!-- Opened, the focus goes to the current page's entry, not to the first one: a focused entry is
       drawn highlighted (substance-tracker, lenzi 2026-10-03). -->
  <mat-sidenav
    #sidebar
    class="sidebar"
    fixedInViewport
    [fixedTopGap]="8"
    [fixedBottomGap]="8"
    mode="over"
    autoFocus='[aria-current="page"]'
  >
    <app-sidebar (navigated)="navigated(sidebar)" />
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      <button mat-icon-button type="button" class="menu" aria-label="Menu" (click)="openSidebar(sidebar, $event)">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">{{ title() }}</span>
      <!-- The new tickets since the user last looked (plan 5.3). -->
      <app-bell />
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

<app-version-label />
